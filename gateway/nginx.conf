events {}
http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
  upstream auth_upstream { server auth-service:8001; }
  upstream product_upstream { server product-service:8002; }
  upstream cart_upstream { server cart-service:8003; }
  upstream order_upstream { server order-service:8004; }
  upstream notification_upstream { server notification-service:8005; }

  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /certs/gateway.crt;
    ssl_certificate_key /certs/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    limit_req zone=api_limit burst=100 nodelay;
    limit_req_status 429;
    add_header Retry-After 1 always;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_certificate /certs/gateway.crt;
    proxy_ssl_certificate_key /certs/gateway.key;
    proxy_ssl_server_name on;

    location /auth/ {
      rewrite ^/auth/(.*)$ /api/v1/auth/$1 break;
      proxy_ssl_name auth-service;
      proxy_pass https://auth_upstream;
    }
    location /products {
      rewrite ^/products(.*)$ /api/v1/products$1 break;
      proxy_ssl_name product-service;
      proxy_pass https://product_upstream;
    }
    location /cart {
      rewrite ^/cart(.*)$ /api/v1/cart$1 break;
      proxy_ssl_name cart-service;
      proxy_pass https://cart_upstream;
    }
    location /orders {
      rewrite ^/orders(.*)$ /api/v1/orders$1 break;
      proxy_ssl_name order-service;
      proxy_pass https://order_upstream;
    }
    location /notifications {
      rewrite ^/notifications(.*)$ /api/v1/notifications$1 break;
      proxy_ssl_name notification-service;
      proxy_pass https://notification_upstream;
    }
  }
}
